name: validate-proposal

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate whole pot
        run: python tools/validate.py all

      - name: Check proposal directories (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'EOF'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import validate
          issues = validate.Issues()
          root = validate.REPO_ROOT / "proposals"
          if root.exists():
              for d in sorted(p for p in root.iterdir() if p.is_dir()):
                  validate.validate_proposal_dir(d, issues)
          print(issues.render())
          sys.exit(0 if issues.ok() else 1)
          EOF

      - name: Registry summary is up to date
        run: |
          cp registry.yaml /tmp/registry.before.yaml
          python tools/summarize.py registry >/dev/null
          diff -q /tmp/registry.before.yaml registry.yaml \
            || { echo "registry.yaml drift: run 'python tools/summarize.py registry'"; exit 1; }